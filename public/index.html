<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- headタグの中にはメタデータ等を記載する -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel=" stylesheet" href=" styles.css">
</head>

<body>
  <!-- bodyタグの中には実際に表示するものなどを書く -->
  <h1>しりとり</h1>
  <!-- スコアを表示する -->
  <h4 >スコア: <span id="score">0</span></h4>
  <!-- 現在の単語を表示する場所 -->
  <div id = "scoreBoard">
    <div>スコアボード</div>
    <div id="previousWord"></div>
  </div>
  <!-- 次の文字を入力するフォーム -->
  <input id="nextWordInput" type="text" />
  <button id="nextWordSendButton">送信</button>
  <!-- リセットを実行するボタン -->
  <p id="finishMessage"></p>
  <button id="resetButton">リセット↻（終了）</button>
  <!-- 過去に出た単語直前5つを表示する場所-->
  <p id="recentWords"></p>
  <!-- JavaScriptを実行 -->
  <script>
  class GameEndHandler {
    constructor(previousWordEl, nextWordInput, nextWordSendButton) {
      this.previousWordEl = previousWordEl;
      this.nextWordInput = nextWordInput;
      this.nextWordSendButton = nextWordSendButton;
    }
    endGame() {
      this.nextWordInput.value = "";
      this.nextWordInput.disabled = true;
      this.nextWordSendButton.disabled = true;
      document.querySelector("#finishMessage").textContent =
    "ゲームオーバーです。リセットボタンで最初からやり直してください。";
    }
    startGame() {
      this.nextWordInput.disabled = false;
      this.nextWordSendButton.disabled = false;
    }
  }
  const handler = new GameEndHandler(
  document.querySelector("#previousWord"),
  document.querySelector("#nextWordInput"),
  document.querySelector("#nextWordSendButton")
  );
    window.onload = async (event) => {
      // GET /shiritoriを実行
      const response = await fetch("/shiritori", { method: "GET" });
      // responseの中からレスポンスのテキストデータを取得
      const { word, score } = await response.json();
      // id: previousWordのタグを取得
      const paragraph = document.querySelector("#previousWord");
      // 取得したタグの中身を書き換える
      paragraph.textContent = `前の単語: ${word}`;
      const recentWordsElement = document.querySelector("#recentWords");
      const recentWordsResponse = await fetch("/recent-words", { method: "GET" });
      const recentWords = await recentWordsResponse.json();
      recentWordsElement.textContent = `直前の単語5つ: [${recentWords.join(", ")}]`;
      document.querySelector("#score").textContent = score;
          // scoreBoard を画面に表示する
    const renderScoreHistory = async () => {
      const response = await fetch("/score-history", { method: "GET" });
      const scoreBoard = await response.json();
      const list = document.querySelector("#scoreHistoryList");

      list.innerHTML = "";
      scoreBoard.forEach((score) => {
        const item = document.createElement("div");
        item.textContent = `スコア: ${score}`;
        list.appendChild(item);
      });
    };
    }

    // 送信ボタンの押下時に実行
    document.querySelector("#nextWordSendButton").onclick = async (event) => {
      // inputタグを取得
      const nextWordInput = document.querySelector("#nextWordInput");
      // inputの中身を取得
      const nextWordInputText = nextWordInput.value;
      // POST /shiritoriを実行
      // 次の単語をresponseに格納
      const response = await fetch(
        "/shiritori",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nextWord: nextWordInputText })
        }
      );
      //scoreの加算指示
      // status: 200以外が返ってきた場合にエラーを表示
      if (response.status !== 200) {
        const errorObj = await response.json();
        alert(errorObj["errorMessage"]);
        if (typeof errorObj.score === "number") {
          document.querySelector("#score").textContent = errorObj.score;
        }
        if(response.status === 401) {
          handler.endGame();
        }
        return;
      }

      const { word, score } = await response.json();
      // scoreの加算指示のレスポンスを取得
      // scoreの表示を更新
      const scoreElement = document.querySelector("#score");
      scoreElement.textContent = score;

      // id: previousWordのタグを取得
      const paragraph = document.querySelector("#previousWord");
      // 取得したタグの中身を書き換える
      paragraph.textContent = `前の単語: ${word}`;
      // 過去に出た単語直前5つを表示する場所の更新
      const recentWordsElement = document.querySelector("#recentWords");
      const recentWordsResponse = await fetch("/recent-words", { method: "GET" });
      const recentWords = await recentWordsResponse.json();
      recentWordsElement.textContent = `直前の単語5つ: [${recentWords.join(", ")}]`;
      // inputタグの中身を消去する
      nextWordInput.value = "";
    }
    
    // リセットボタン押下時に実行
    document.querySelector("#resetButton").onclick = async (event) => {
      // POST /resetを実行
      const response = await fetch("/reset", {
        method: "POST",
      });

      // status: 200以外が返ってきた場合にエラーを表示
      if (response.status !== 200) {
        const errorJson = await response.text();
        const errorObj = JSON.parse(errorJson);
        alert(errorObj["errorMessage"]);
        handler.endGame();
        return;
      }
      // scoreBoard を画面に表示する
    const renderScoreHistory = async () => {
      const response = await fetch("/score-history", { method: "GET" });
      const scoreBoard = await response.json();
      const list = document.querySelector("#scoreHistoryList");

      list.innerHTML = "";
      scoreBoard.forEach((score) => {
        const item = document.createElement("div");
        item.textContent = `スコア: ${score}`;
        list.appendChild(item);
      });
    };

      // 表示を初期状態に戻す
      const { word, score } = await response.json();
      document.querySelector("#previousWord").textContent = `前の単語: ${word}`;
      document.querySelector("#score").textContent = score;
      document.querySelector("#recentWords").textContent = "直前の単語5つ: []";
      document.querySelector("#finishMessage").textContent = "";
      handler.startGame();
    }
    
    window.addEventListener("beforeunload", async () => {
    const scoreHistoryList = document.querySelector("#scoreHistoryList");
    if (scoreHistoryList) {
      scoreHistoryList.innerHTML = "";
    }

    await fetch("/reset", { method: "POST" });
  });
  </script>
</body>

</html>
