<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- headタグの中にはメタデータ等を記載する -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel=" stylesheet" href=" styles.css">
</head>

<body>
  <!-- bodyタグの中には実際に表示するものなどを書く -->
  <h1>しりとり</h1>
  <!-- 現在の単語を表示する場所 -->
  <p id="previousWord"></p>
  <!-- 次の文字を入力するフォーム -->
  <input id="nextWordInput" type="text" />
  <button id="nextWordSendButton">送信</button>
  <!-- リセットを実行するボタン -->
  <p id="finishMessage"></p>
  <button id="resetButton">リセット↻（終了）</button>
  <!-- JavaScriptを実行 -->
  <script>
  class GameEndHandler {
    constructor(previousWordEl, nextWordInput, nextWordSendButton) {
      this.previousWordEl = previousWordEl;
      this.nextWordInput = nextWordInput;
      this.nextWordSendButton = nextWordSendButton;
    }
    endGame() {
      this.nextWordInput.value = "";
      this.nextWordInput.disabled = true;
      this.nextWordSendButton.disabled = true;
      document.querySelector("#finishMessage").textContent =
    "ゲームオーバーです。リセットボタンで最初からやり直してください。";
    }
    startGame() {
      this.nextWordInput.disabled = false;
      this.nextWordSendButton.disabled = false;
    }
  }
  const handler = new GameEndHandler(
  document.querySelector("#previousWord"),
  document.querySelector("#nextWordInput"),
  document.querySelector("#nextWordSendButton")
  );
    window.onload = async (event) => {
      // GET /shiritoriを実行
      const response = await fetch("/shiritori", { method: "GET" });
      // responseの中からレスポンスのテキストデータを取得
      const previousWord = await response.text();
      // id: previousWordのタグを取得
      const paragraph = document.querySelector("#previousWord");
      // 取得したタグの中身を書き換える
      paragraph.innerHTML = `前の単語: ${previousWord}`;
    }

    // 送信ボタンの押下時に実行
    document.querySelector("#nextWordSendButton").onclick = async (event) => {
      // inputタグを取得
      const nextWordInput = document.querySelector("#nextWordInput");
      // inputの中身を取得
      const nextWordInputText = nextWordInput.value;
      // POST /shiritoriを実行
      // 次の単語をresponseに格納
      const response = await fetch(
        "/shiritori",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nextWord: nextWordInputText })
        }
      );

      // status: 200以外が返ってきた場合にエラーを表示
      if (response.status !== 200) {
        const errorJson = await response.text();
        const errorObj = JSON.parse(errorJson);
        alert(errorObj["errorMessage"]);
        if(response.status === 401) {
          handler.endGame();
        }
        return;
      }

      const previousWord = await response.text();

      // id: previousWordのタグを取得
      const paragraph = document.querySelector("#previousWord");
      // 取得したタグの中身を書き換える
      paragraph.innerHTML = `前の単語: ${previousWord}`;
      // inputタグの中身を消去する
      nextWordInput.value = "";
    }
    
    // リセットボタン押下時に実行
    document.querySelector("#resetButton").onclick = async (event) => {
      // POST /resetを実行
      const response = await fetch("/reset", {
        method: "POST",
      });

      // status: 200以外が返ってきた場合にエラーを表示
      if (response.status !== 200) {
        const errorJson = await response.text();
        const errorObj = JSON.parse(errorJson);
        alert(errorObj["errorMessage"]);
        handler.endGame();
        return;
      }

      // 表示を初期状態に戻す
      const previousWord = await response.text();
      document.querySelector("#previousWord").textContent = `前の単語: ${previousWord}`;
      document.querySelector("#finishMessage").textContent = "";
      handler.startGame();
    }
  </script>
</body>

</html>
